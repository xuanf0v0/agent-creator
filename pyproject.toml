[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "openagent-studio"
version = "0.1.0"
description = "Local graphical control plane for OpenCode and Agent Harness"
requires-python = ">=3.11"
dependencies = [
  "cryptography>=43,<47",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "pydantic>=2.8,<3",
  "pyyaml>=6,<7",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "httpx>=0.27,<1"]

[project.scripts]
openagent-studio = "openagent_studio.app:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.package-data]
openagent_studio = ["static/**/*"]
