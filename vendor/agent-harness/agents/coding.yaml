id: coding
name: Coding CLI Example
description: A no-LLM one-shot worker demonstrating governed tasks.
cwd: ../examples/coding_agent
environment:
  setup_command: [uv, sync]
task:
  command: [uv, run, python, worker.py]
  verification:
    - name: output exists
      command: [uv, run, python, verify.py]
      timeout_seconds: 30
  tools:
    allow: [read, write]
    ask: [network]
    deny: [destructive]
