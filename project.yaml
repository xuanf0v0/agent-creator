version: '1'
name: 我的第一个智能体项目
project_dir: .
agents:
- id: coding
  name: OpenCode 代码助手
  description: 通过真实 OpenCode 模型在当前项目中完成任务
  mode: primary
  model: deepseek/deepseek-v4-flash
  prompt: '你是一名谨慎的代码助手。

    开始工作前先阅读项目说明，完成任务后运行验证命令。

    不要修改任务范围之外的文件。

    '
  max_steps: 30
  tools: {}
  permission:
    edit: allow
    bash: ask
    webfetch: ask
providers:
- id: deepseek
  name: DeepSeek API
  npm: '@ai-sdk/openai-compatible'
  base_url: https://api.deepseek.com
  api_key_env: OPENAI_API_KEY
  env_file: .env
  models:
    deepseek-v4-flash:
      name: DeepSeek V4 Flash
harness:
- id: coding
  name: OpenCode 模型任务
  description: 独立 my-harness 治理下的真实 OpenCode CLI 任务
  backend_id: default
  agent_id: coding
workflows:
- id: product-selection
  name: 智能选品决策流程
  nodes: []
  edges: []
  evaluation:
    cases: []
integrations:
  feishu:
  - id: main
    name: 飞书选品机器人
    workflow_id: product-selection
    app_id_env: FEISHU_APP_ID
    app_secret_env: FEISHU_APP_SECRET
    verification_token_env: FEISHU_VERIFICATION_TOKEN
    encrypt_key_env: FEISHU_ENCRYPT_KEY
    env_file: .env
    auto_reply: true
  qq:
  - id: main
    name: QQ 选品机器人
    workflow_id: product-selection
    app_id_env: QQ_BOT_APP_ID
    secret_env: QQ_BOT_SECRET
    env_file: .env
    auto_reply: true
description: 用于体验 OpenAgent Studio 中文配置界面的示例项目
