version: '1'
name: 我的第一个智能体项目
project_dir: .
agents:
- id: coding
  name: OpenCode 代码助手
  description: 通过真实 OpenCode 模型在当前项目中完成任务
  mode: primary
  model: deepseek/deepseek-v4-flash
  prompt: '你是一名谨慎的代码助手。

    开始工作前先阅读项目说明，完成任务后运行验证命令。

    不要修改任务范围之外的文件。

    '
  max_steps: 30
  tools: {}
  permission:
    edit: allow
    bash: ask
    webfetch: ask
providers:
- id: deepseek
  name: DeepSeek API
  npm: '@ai-sdk/openai-compatible'
  base_url: https://api.deepseek.com
  api_key_env: OPENAI_API_KEY
  env_file: .env
  models:
    deepseek-v4-flash:
      name: DeepSeek V4 Flash
harness:
- id: coding
  name: OpenCode 模型任务
  description: 独立 my-harness 治理下的真实 OpenCode CLI 任务
  backend_id: default
  agent_id: coding
  labels:
    runtime.example/implementation: openagent-harness-opencode
    runtime.example/model: deepseek/deepseek-v4-flash
    runtime.example/capability: text-generation
    runtime.example/sandbox: read-only
  protocol: stdin_json
- id: repository-analysis
  name: OpenCode 只读仓库分析
  description: 读取、列出和搜索仓库；禁止运行命令和修改文件
  backend_id: default
  agent_id: repository-analysis
  labels:
    runtime.example/implementation: openagent-harness-opencode
    runtime.example/model: deepseek/deepseek-v4-flash
    runtime.example/capability: repository-analysis
    runtime.example/sandbox: read-only
  protocol: stdin_json
- id: test-runner
  name: OpenCode 只读测试执行
  description: 仅运行仓库测试命令；禁止修改项目文件
  backend_id: default
  agent_id: test-runner
  labels:
    runtime.example/implementation: openagent-harness-opencode
    runtime.example/model: deepseek/deepseek-v4-flash
    runtime.example/capability: test-execution
    runtime.example/sandbox: read-only
  protocol: stdin_json
workflows:
- id: product-selection
  name: 空白工作流
  nodes: []
  edges: []
  evaluation:
    cases: []
- id: n8n-fetch
  name: n8n 连接器调用示例
  nodes:
  - id: trigger
    type: manual_trigger
    data: {}
    position:
      x: 80.0
      y: 80.0
  - id: fetch
    type: http_request
    data:
      url: http://127.0.0.1:5678/webhook/studio-fetch-sheet
      method: POST
      headers:
        Content-Type: application/json
      body:
        query: '{{input.query}}'
        metadata:
          enabled: '{{input.enabled}}'
        items:
        - '{{input.items}}'
      allow_private: true
      timeout_seconds: 60
      fail_on_error: true
    position:
      x: 360.0
      y: 80.0
  - id: result
    type: output
    data: {}
    position:
      x: 640.0
      y: 80.0
  edges:
  - source: trigger
    target: fetch
  - source: fetch
    target: result
  evaluation:
    cases:
    - id: ok-response
      name: n8n 返回正常数据
      enabled: true
      input:
        query: test-query
        enabled: true
        items:
        - 1
        - 2
      assertions:
      - path: status
        operator: equals
        expected: 200
      - path: body
        operator: exists
      - path: body.ok
        operator: equals
        expected: true
      - path: body.query
        operator: equals
        expected: test-query
      - path: body.source
        operator: equals
        expected: n8n
      semantic_criteria: []
      approvals: {}
      mocks: []
      timeout_seconds: 90
- id: n8n-callback
  name: n8n 回调入站示例
  nodes:
  - id: callback
    type: webhook
    data:
      path: /hooks/n8n-callback
    position:
      x: 80.0
      y: 80.0
  - id: result
    type: output
    data: {}
    position:
      x: 360.0
      y: 80.0
  edges:
  - source: callback
    target: result
  evaluation:
    cases:
    - id: callback-payload
      name: n8n 回调负载
      enabled: true
      input:
        trigger: webhook
        body:
          source: n8n
          message: callback-test
          received:
            value: 42
      assertions:
      - path: body.source
        operator: equals
        expected: n8n
      - path: body.received.value
        operator: equals
        expected: 42
      semantic_criteria: []
      approvals: {}
      mocks: []
      timeout_seconds: 90
integrations:
  feishu:
  - id: main
    name: 飞书选品机器人
    workflow_id: product-selection
    app_id_env: FEISHU_APP_ID
    app_secret_env: FEISHU_APP_SECRET
    verification_token_env: FEISHU_VERIFICATION_TOKEN
    encrypt_key_env: FEISHU_ENCRYPT_KEY
    env_file: .env
    auto_reply: true
  qq:
  - id: main
    name: QQ 选品机器人
    workflow_id: product-selection
    app_id_env: QQ_BOT_APP_ID
    secret_env: QQ_BOT_SECRET
    env_file: .env
    auto_reply: true
description: 用于体验 OpenAgent Studio 中文配置界面的示例项目
