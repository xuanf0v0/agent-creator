version: '1'
name: 我的第一个智能体项目
project_dir: .
agents:
- id: coding
  name: OpenCode 代码助手
  description: 通过真实 OpenCode 模型在当前项目中完成任务
  mode: primary
  model: deepseek/deepseek-v4-flash
  prompt: '你是一名谨慎的代码助手。

    开始工作前先阅读项目说明，完成任务后运行验证命令。

    不要修改任务范围之外的文件。

    '
  max_steps: 30
  tools: {}
  permission:
    edit: allow
    bash: ask
    webfetch: ask
providers:
- id: deepseek
  name: DeepSeek API
  npm: '@ai-sdk/openai-compatible'
  base_url: https://api.deepseek.com
  api_key_env: OPENAI_API_KEY
  env_file: .env
  models:
    deepseek-v4-flash:
      name: DeepSeek V4 Flash
harness:
- id: coding
  name: OpenCode 模型任务
  description: 独立 my-harness 治理下的真实 OpenCode CLI 任务
  backend_id: default
  agent_id: coding
  labels:
    runtime.example/implementation: openagent-harness-opencode
    runtime.example/model: deepseek/deepseek-v4-flash
    runtime.example/capability: text-generation
    runtime.example/sandbox: read-only
  protocol: stdin_json
workflows:
- id: product-selection
  name: 代码审查工作流
  nodes:
  - id: manual-trigger
    type: manual_trigger
    data:
      parameters:
      - name: code
        type: string
        description: 待审查的代码
        required: true
      description: manual-trigger
    position:
      x: 80.0
      y: 80.0
  - id: code-review-agent
    type: agent
    data:
      agent_id: coding
      prompt: '你是一个严格的静态代码审查助手。请仅对下列代码做静态审查，逐项检查：1) 未定义变量的使用；2) 除数为零风险（包括常量除零与可能为
        0 的变量除法）；3) SQL 注入风险（重点检查使用字符串拼接构造 SQL 语句）；4) 代码可读性。逐项列出发现的问题及位置，最后单独输出一行：''总体结论：通过''
        或 ''总体结论：不通过''。

        待审查代码：

        {{input}}'
      description: code-review-agent
    position:
      x: 320.0
      y: 80.0
  - id: review-output
    type: output
    data:
      template: '{{latest}}'
      description: review-output
    position:
      x: 560.0
      y: 80.0
  edges:
  - source: manual-trigger
    target: code-review-agent
  - source: code-review-agent
    target: review-output
  evaluation:
    cases:
    - id: negative-undefined-var-divide-zero
      name: 用例1：未定义变量与除零导致不通过
      enabled: true
      input:
        code: function bad(x){ y = undefinedVar; return x/0; }
      assertions:
      - path: output
        operator: exists
      - path: output
        operator: contains
        expected: 总体结论：不通过
      semantic_criteria:
      - 输出明确指出未定义变量 undefinedVar 的使用
      - 输出明确指出除数为零风险
      - 总体结论为“不通过”
      approvals: {}
      mocks: []
      timeout_seconds: 300
    - id: negative-sql-injection
      name: 用例2：SQL 拼接注入导致不通过
      enabled: true
      input:
        code: const q = 'SELECT * FROM users WHERE id = ' + userId;
      assertions:
      - path: output
        operator: exists
      - path: output
        operator: contains
        expected: 总体结论：不通过
      semantic_criteria:
      - 输出明确指出字符串拼接构造 SQL 的注入风险
      - 总体结论为“不通过”
      approvals: {}
      mocks: []
      timeout_seconds: 300
    - id: positive-multiply-function
      name: 用例3：正确的 multiply 函数判定为通过
      enabled: true
      input:
        code: function multiply(a, b){ return a * b; }
      assertions:
      - path: output
        operator: exists
      - path: output
        operator: contains
        expected: 总体结论：通过
      semantic_criteria:
      - 输出对正确代码未报告重大缺陷
      - 总体结论为“通过”
      approvals: {}
      mocks: []
      timeout_seconds: 300
integrations:
  feishu:
  - id: main
    name: 飞书选品机器人
    workflow_id: product-selection
    app_id_env: FEISHU_APP_ID
    app_secret_env: FEISHU_APP_SECRET
    verification_token_env: FEISHU_VERIFICATION_TOKEN
    encrypt_key_env: FEISHU_ENCRYPT_KEY
    env_file: .env
    auto_reply: true
  qq:
  - id: main
    name: QQ 选品机器人
    workflow_id: product-selection
    app_id_env: QQ_BOT_APP_ID
    secret_env: QQ_BOT_SECRET
    env_file: .env
    auto_reply: true
description: 用于体验 OpenAgent Studio 中文配置界面的示例项目
